# Daily paper-trading run, on GitHub's runners rather than a laptop.
#
# This replaces the Managed Agents deployment. Every step that decides money
# already lives in scripts/paper_trade.py, which posts to Slack itself; the
# agent was only writing prose and flagging oddities, so dropping it costs
# judgment commentary and nothing else. The skip reasons and the absurd-edge
# guard still reach Slack.
name: paper trade

# The schedule is OFF. The live path is the Claude cloud routine
# (deploy/routine_prompt.md), and that file's rule is "run one or the other,
# never both, or the ledger gets two rows for the same pick". A cron sitting
# here armed is that rule waiting to be broken by whoever re-enables Actions on
# the repo — silently, into an append-only ledger.
#
# Manual dispatch stays: this workflow is the fallback if the routine has to be
# abandoned mid-run. To make it the live path again, restore the cron below AND
# stop the routine, in that order.
#
#  schedule:
#    # 09:00 UTC. Deliberately not a local wall clock: a time skipped by a
#    # spring-forward never fires and one repeated by a fall-back fires twice,
#    # and a fourteen-day run cannot absorb either.
#    - cron: "0 9 * * *"
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full path without writing the ledger or posting"
        type: boolean
        default: false
      preview:
        # Re-posts the last committed day from the ledger. Prices nothing and
        # writes nothing, so it does not count as a second writer under the
        # "run one or the other, never both" rule in deploy/routine_prompt.md
        # — which is what makes it safe to fire mid-run just to read the post.
        description: "Re-post the latest day's summary to check formatting"
        type: boolean
        default: false

# The ledger is append-only and committed back to this repo. Two runs writing
# at once would race on that commit.
concurrency:
  group: paper-trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # From requirements.txt, never a list spelled out here. This step used to
      # carry its own copy of the dependencies and the cloud routine's setup
      # script carried another; they drifted, the routine's copy lost
      # scikit-learn, and the 2026-08-19 run died on `import sklearn`. One list,
      # one place. See the header of requirements.txt.
      #
      # No Playwright and no oddsharvester: the odds source is PointsBet's
      # JSON API over urllib since 2026-08-10, when Cloudflare blocked the
      # headless-Chromium scrape of OddsPortal outright. See
      # reports/paper_trading_setup.md, and .github/workflows/cloudflare-probe.yml
      # for whether that block also applies to these runners.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the odds parsing before trusting it with money
        run: python -m scripts.fetch_pointsbet --self-check

      - name: Verify the results parsing before trusting it with money
        run: python -m scripts.fetch_results --self-check

      - name: Verify the arithmetic before trusting it with money
        run: python -m scripts.paper_trade --self-check

      - name: Rehearse the whole chain on a cached match
        run: python -m scripts.paper_trade --rehearse

      - name: Run the daily job
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          if [ "${{ inputs.preview }}" = "true" ]; then
            python -m scripts.paper_trade --preview
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m scripts.paper_trade --dry-run
            python -m scripts.paper_trade --dry-run --variant cascade
            python -m scripts.paper_trade --dry-run --variant nocohort
          else
            # All three variants, same fixtures, separate ledgers. The
            # incumbent runs first: a day with challenger rows and no
            # incumbent rows is worse than a day with neither, so a failure in
            # the first must stop the rest. `set -e` is on by default, which
            # gives that. nocohort runs last because it started latest and its
            # window is the one that can be restarted most cheaply.
            python -m scripts.paper_trade
            python -m scripts.paper_trade --variant cascade
            python -m scripts.paper_trade --variant nocohort
          fi

      - name: Commit the ledger
        if: ${{ inputs.dry_run != true && inputs.preview != true }}
        run: |
          if [ -z "$(git status --porcelain paper/)" ]; then
            echo "no ledger change today"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only paper/. Nothing else this job touches belongs in a commit,
          # and a past ledger row is never amended — settlement appends.
          git add paper/
          git commit -m "paper trading: $(date -u +%Y-%m-%d)"
          git push

      # A broken day that nobody notices is worse than a bad day. The run is
      # fourteen days long and every step above can end it — a blocked odds
      # source, a failed self-check, a rejected push — and until now all of
      # them ended it silently, because Slack was only reached on the success
      # path. A gap found on day 14 cannot be filled.
      #
      # Inline curl rather than scripts.paper_trade's post_slack: the failure
      # being reported may be that the module does not import or that its
      # dependencies never installed, and the alarm must not share a failure
      # mode with the thing it is alarming about.
      - name: Alert Slack if the run failed
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "run failed and no Slack credentials are set; cannot alert" >&2
            exit 0
          fi
          text=":rotating_light: *Tennis paper trading FAILED* · $(date -u +%Y-%m-%d)"$'\n'
          text="${text}No picks were written and no settlement ran for this date,"
          text="${text} so the ledger has a gap unless the next run fills it."$'\n'
          text="${text}Failed job: ${RUN_URL}"
          # jq builds the payload so a quote or newline in the text cannot
          # produce malformed JSON and turn the alert into a second silence.
          reply=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg c "$SLACK_CHANNEL" --arg t "$text" \
                        '{channel: $c, text: $t}')")
          echo "$reply"
          case "$reply" in
            *'"ok":true'*) ;;
            *) echo "Slack rejected the failure alert" >&2 ;;
          esac
