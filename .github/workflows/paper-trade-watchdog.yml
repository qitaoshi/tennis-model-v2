# Watchdog for the daily paper-trading run. Reads the ledger; writes nothing.
#
# The run itself is a Claude cloud routine (deploy/routine_prompt.md), not this
# repo's Actions. A routine can post its own failures — its prompt says to —
# but it cannot report the one failure that actually happened: on 2026-08-11 it
# did not fire at all, and day 2 of 14 went missing with nothing said. No
# instruction inside a prompt can cover the prompt never being read.
#
# So the check lives outside the thing it is checking. It never prices, never
# scrapes, never commits, and never touches paper/ — it reads one CSV and posts
# if a day is absent. That is what keeps it safe to run alongside the routine
# despite the "run one or the other, never both" rule in
# deploy/routine_prompt.md: that rule is about two things WRITING the ledger.
name: paper trade watchdog

on:
  schedule:
    # 12:00 UTC, and it checks YESTERDAY rather than today. The routine's slot
    # is not fixed — 2026-08-10 saw runs at 13:11 and 23:11 UTC — so any
    # same-day check would false-alarm on a routine that simply had not run
    # yet. A daily false alarm gets muted, and a muted alarm is worse than no
    # alarm. Checking a completed day costs up to ~36h of detection lag and
    # buys zero false positives.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        # The alert step only runs on a day that is actually missing, so the
        # Slack credentials are otherwise first exercised at the exact moment
        # they are needed. This fires the post on a healthy day instead, to
        # prove the token and channel work. The message says TEST so a drill
        # is never mistaken for a real gap.
        description: "Post a test alert to Slack even if no day is missing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check yesterday produced ledger rows
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, datetime, json, pathlib

          # EVERY variant's ledger, not just the incumbent's. Checking only
          # paper/ledger.csv is how the cascade variant went missing without a
          # word: it was added on 2026-08-15 and the deployed routine — running
          # an older copy of deploy/routine_prompt.md that has no `--variant
          # cascade` step — wrote incumbent rows on 08-16 and 08-17 while
          # ledger-cascade.csv stayed frozen at day 1. Both days looked healthy
          # here. A day where one variant writes and the other does not is
          # worse than a day where neither does: the two ledgers stop covering
          # the same fixtures, so the difference between them stops being the
          # model, and nothing in the numbers says so afterwards.
          paper = pathlib.Path("paper")
          day = (datetime.datetime.now(datetime.timezone.utc).date()
                 - datetime.timedelta(days=1))

          def out(missing, partial, why):
              print(f"missing={'true' if missing else 'false'}")
              print(f"partial={'true' if partial else 'false'}")
              print(f"day={day}")
              print(f"why={why}")
              raise SystemExit(0)

          # Variants are discovered from the run_state files, not imported from
          # scripts.paper_trade: this job installs nothing, which is what lets
          # it still report a day that went missing *because* the run's
          # dependencies failed to install. A new variant is picked up here for
          # free, the moment it writes its first state file.
          states = sorted(paper.glob("run_state*.json"))
          if not states:
              out(False, False, "no run_state file; the run has not started")

          wrote, absent, outside = [], [], []
          for st in states:
              suffix = st.stem[len("run_state"):]        # "" or "-cascade"
              led = paper / f"ledger{suffix}.csv"
              s = json.loads(st.read_text())
              name = s.get("variant") or suffix.lstrip("-") or "primary"
              start = datetime.date.fromisoformat(s["start_date"])
              end = start + datetime.timedelta(days=int(s.get("run_days", 14)) - 1)
              # Silence outside the window: the run being over is not a
              # failure, and an alarm that keeps firing after the finish gets
              # muted. Each variant carries its own window.
              if not start <= day <= end:
                  outside.append(f"{name} (window {start}..{end})")
                  continue
              if not led.exists():
                  absent.append(f"{name} ({led} does not exist)")
                  continue
              # Parsed as CSV, not grepped: a bare date string also appears in
              # match_date and ts_utc, and matching those would report a
              # healthy day for one that wrote nothing.
              with led.open(newline="") as fh:
                  n = sum(1 for r in csv.DictReader(fh)
                          if r.get("run_date") == day.isoformat())
              (wrote if n else absent).append(
                  f"{name} ({n} row(s))" if n else name)

          if not absent:
              if not wrote:
                  out(False, False, f"{day} is outside every run window: "
                                    + ", ".join(outside))
              out(False, False, "wrote rows: " + ", ".join(wrote))

          why = "no rows for: " + ", ".join(absent)
          if wrote:
              why += " — but " + ", ".join(wrote) + " did write"
          if outside:
              why += "; not due: " + ", ".join(outside)
          # Partial means the routine fired and did only part of its job, which
          # points at the deployed prompt rather than at the schedule.
          out(True, bool(wrote), why)
          PY

      - name: Report
        run: 'echo "${{ steps.check.outputs.day }}: ${{ steps.check.outputs.why }}"'

      # Fires both when a day is missing AND when the check itself broke —
      # a watchdog that can fail silently is not a watchdog.
      - name: Alert Slack
        if: steps.check.outputs.missing == 'true' || inputs.force_alert || failure()
        env:
          FORCED: ${{ inputs.force_alert }}
          MISSING: ${{ steps.check.outputs.missing }}
          PARTIAL: ${{ steps.check.outputs.partial }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          DAY: ${{ steps.check.outputs.day }}
          WHY: ${{ steps.check.outputs.why }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "watchdog fired but no Slack credentials are set" >&2
            exit 1
          fi
          if [ "$FORCED" = "true" ] && [ "$MISSING" != "true" ]; then
            text=":test_tube: *Watchdog test — no day is missing, this is a drill*"$'\n'
            text="${text}${DAY}: ${WHY}"$'\n'
            text="${text}Slack credentials work. Watchdog: ${RUN_URL}"
          elif [ "$PARTIAL" = "true" ]; then
            # Some variants wrote and some did not. The routine fired, so this
            # is not a missed schedule — it is the job doing only part of its
            # work, which in practice means the prompt deployed at
            # claude.ai/code/routines is behind deploy/routine_prompt.md.
            text=":rotating_light: *Tennis paper trading — a PARTIAL day*"$'\n'
            text="${text}${DAY:-unknown}: ${WHY:-the watchdog itself failed}"$'\n'
            text="${text}The routine ran but did not write every variant, so the"
            text="${text} ledgers no longer cover the same fixtures and the"
            text="${text} difference between them is no longer just the model."
            text="${text} Check the routine's prompt matches"
            text="${text} deploy/routine_prompt.md — a variant added to the repo"
            text="${text} does not reach a routine whose prompt was pasted"
            text="${text} before it."$'\n'
            text="${text}Watchdog: ${RUN_URL}"
          else
            text=":rotating_light: *Tennis paper trading — a day is missing*"$'\n'
            text="${text}${DAY:-unknown}: ${WHY:-the watchdog itself failed}"$'\n'
            text="${text}The routine did not write to the ledger for that date."
            text="${text} A missing day is a permanent gap — a pick has to be"
            text="${text} timestamped before its match, so it cannot be"
            text="${text} backfilled. Check the routine ran."$'\n'
            text="${text}Watchdog: ${RUN_URL}"
          fi
          reply=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg c "$SLACK_CHANNEL" --arg t "$text" \
                        '{channel: $c, text: $t}')")
          echo "$reply"
          case "$reply" in
            *'"ok":true'*) ;;
            *) echo "Slack rejected the watchdog alert" >&2; exit 1 ;;
          esac
