# One-off diagnostic: can headless Chromium reach OddsPortal from a GitHub
# runner?
#
# On 2026-08-10, day 1 of the forward test, the OddsPortal scrape collected
# nothing from the Managed Agents sandbox: plain curl returned HTTP 200 while
# a Playwright navigation to the same page died instantly with
# net::ERR_CONNECTION_RESET. That is Cloudflare rejecting the headless
# fingerprint from a datacentre IP. The source was replaced with PointsBet's
# JSON API (scripts/fetch_pointsbet.py).
#
# That failure happened on a different host to this one. GitHub's runners are
# Azure IPs — a heavily-scraped range, so the prior is that they fare no
# better — but it was never actually tested, and it is cheap to test rather
# than assume. This workflow answers it.
#
# Nothing here writes a ledger row, posts to Slack, or touches paper/. It is
# manual-only and safe to run at any time.
#
# Reading the result:
#   FAILED ... ERR_CONNECTION_RESET  -> same block; OddsPortal is dead here too.
#   STATUS 403, or a "Just a moment" -> challenged, not reset. Stealth tooling
#                                       has a real chance.
#   STATUS 200 and a real title      -> it works from Actions. Even then, see
#                                       reports/paper_trading_setup.md before
#                                       moving pricing back: a source that can
#                                       start challenging mid-run is what cost
#                                       day 1 in the first place.
name: cloudflare probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # Establishes the baseline. If curl also fails, the problem is not
      # Cloudflare's headless detection and the comparison below is void.
      - name: Plain HTTP reachability (no browser)
        run: |
          echo "--- curl, no browser ---"
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 30 https://www.oddsportal.com/matches/tennis/ || \
            echo "curl FAILED (exit $?)"

      - name: Headless Chromium navigation
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://www.oddsportal.com/matches/tennis/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              try:
                  resp = page.goto(URL, timeout=45000, wait_until="domcontentloaded")
                  print("STATUS", resp.status if resp else None)
                  print("TITLE", repr(page.title()))
                  body = page.content()
                  print("LENGTH", len(body))
                  # Cloudflare's interstitial is recognisable in the markup even
                  # when it returns 200, so the status alone is not the answer.
                  for marker in ("Just a moment", "cf-browser-verification",
                                 "Checking your browser", "cf_chl"):
                      if marker.lower() in body.lower():
                          print("CHALLENGE MARKER FOUND:", marker)
                  print("--- first 800 chars ---")
                  print(body[:800])
              except Exception as exc:
                  print("FAILED", type(exc).__name__, exc)
              finally:
                  browser.close()
          PY
